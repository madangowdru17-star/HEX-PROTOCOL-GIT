<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX CHEATS GITXOS - Keys Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
        
        :root {
            --primary: #00ff88;
            --secondary: #0066ff;
            --accent: #ff00ff;
            --dark-bg: #000814;
            --card-bg: rgba(20, 20, 50, 0.7);
            --border-color: rgba(0, 255, 136, 0.1);
        }
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background: linear-gradient(135deg, #000814 0%, #001040 50%, #000814 100%);
            background-attachment: fixed;
            color: #fff; 
            min-height: 100vh;
        }
        
        .header {
            background: rgba(0, 8, 20, 0.9);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            backdrop-filter: blur(30px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.08);
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #00cc66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header h1 i {
            -webkit-text-fill-color: var(--primary);
            font-size: 28px;
        }
        
        .header .badge {
            background: rgba(0, 255, 136, 0.08);
            color: var(--primary);
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 11px;
            letter-spacing: 1px;
            border: 1px solid var(--border-color);
            font-weight: 500;
            text-transform: uppercase;
        }
        
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .header .user-info .logout-btn {
            background: linear-gradient(135deg, rgba(255, 68, 68, 0.1), rgba(255, 100, 100, 0.05));
            color: #ff6464;
            border: 1px solid rgba(255, 100, 100, 0.2);
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .header .user-info .logout-btn:hover {
            background: linear-gradient(135deg, rgba(255, 68, 68, 0.2), rgba(255, 100, 100, 0.1));
            border-color: #ff6464;
            color: #ff8888;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 68, 68, 0.2);
        }
        
        .nav {
            background: rgba(0, 8, 20, 0.9);
            border-bottom: 1px solid var(--border-color);
            padding: 0 40px;
            display: flex;
            gap: 0;
            flex-wrap: wrap;
            backdrop-filter: blur(30px);
            position: sticky;
            top: 72px;
            z-index: 99;
        }
        
        .nav a {
            padding: 16px 28px;
            color: #888;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
            position: relative;
        }
        
        .nav a:hover { 
            color: var(--primary);
        }
        
        .nav a.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .nav a i { margin-right: 8px; }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px;
        }
        
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .panel h3 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 16px;
            letter-spacing: 1px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .panel h3 i {
            opacity: 0.8;
            font-size: 18px;
        }
        
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-box input,
        .search-box select {
            padding: 14px 18px;
            background: rgba(30, 40, 80, 0.4);
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
        }
        
        .search-box input::placeholder {
            color: #666;
        }
        
        .search-box input:focus,
        .search-box select:focus {
            outline: none;
            border-color: rgba(0, 255, 136, 0.4);
            background: rgba(30, 40, 80, 0.6);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff6464, #ff4444);
            color: #fff;
            box-shadow: 0 8px 24px rgba(255, 100, 100, 0.3);
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 100, 100, 0.4);
        }
        
        .btn-sm {
            padding: 8px 16px;
            font-size: 10px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 28px;
            border-radius: 14px;
            font-weight: 600;
            z-index: 10000;
            animation: slideIn 0.5s ease;
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .toast-success { background: linear-gradient(135deg, var(--primary), #00cc66); color: #000; }
        .toast-error { background: linear-gradient(135deg, #ff6464, #ff4444); color: #fff; }
        
        .footer {
            text-align: center;
            padding: 30px 40px;
            color: #666;
            font-size: 10px;
            letter-spacing: 1px;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
            text-transform: uppercase;
            background: linear-gradient(180deg, rgba(0, 8, 20, 0.5), rgba(0, 0, 0, 0.8));
        }
        
        .footer span {
            color: var(--primary);
            font-weight: 600;
        }
        
        .scrollable {
            max-height: 500px;
            overflow-y: auto;
            padding: 4px;
        }
        
        .scrollable::-webkit-scrollbar {
            width: 6px;
        }
        
        .scrollable::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 3px;
        }
        
        .scrollable::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 136, 0.2);
            border-radius: 3px;
        }
        
        .scrollable::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 136, 0.4);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        
        th {
            text-align: left;
            padding: 14px 12px;
            color: #999;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            font-weight: 600;
            background: rgba(0, 255, 136, 0.02);
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.05);
            color: #aaa;
        }
        
        tr:hover td {
            background: rgba(0, 255, 136, 0.04);
        }
        
        .key-type-badge {
            display: inline-block;
            padding: 3px 11px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .key-type-standard { background: rgba(0, 255, 136, 0.15); color: var(--primary); }
        .key-type-5hour { background: rgba(0, 204, 255, 0.15); color: #00ccff; }
        .key-type-custom { background: rgba(255, 170, 0, 0.15); color: #ffaa00; }
        
        .duration-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .duration-hours { background: rgba(0, 255, 136, 0.15); color: var(--primary); }
        .duration-days { background: rgba(0, 153, 255, 0.15); color: #66aaff; }
        .duration-5hour { background: rgba(0, 204, 255, 0.15); color: #00ccff; }
        
        .status-active { color: var(--primary); }
        .status-used { color: #ffaa00; }
        .status-expired { color: #ff6464; }
        .status-inactive { color: #888; }
        
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 12px; padding: 15px 20px; }
            .header h1 { font-size: 20px; }
            .nav { padding: 0 20px; overflow-x: auto; flex-wrap: nowrap; top: 68px; }
            .nav a { padding: 14px 18px; font-size: 10px; white-space: nowrap; }
            .container { padding: 20px; }
            .panel { padding: 20px; }
            .search-box { flex-direction: column; }
            .search-box input,
            .search-box select { width: 100%; }
            .scrollable { max-height: 300px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-keys"></i> KEYS MANAGEMENT</h1>
        <div class="user-info">
            <span class="badge"><i class="fas fa-shield-alt"></i> SECURE</span>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> EXIT</button>
        </div>
    </div>
    
    <div class="nav">
        <a href="/dashboard"><i class="fas fa-home"></i> DASHBOARD</a>
        <a href="/keys" class="active"><i class="fas fa-keys"></i> KEYS</a>
        <a href="/devices"><i class="fas fa-laptop"></i> DEVICES</a>
        <a href="/api-status"><i class="fas fa-code"></i> API</a>
    </div>
    
    <div class="container">
        <div class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; margin-bottom:20px;">
                <h3><i class="fas fa-list"></i> ALL KEYS</h3>
                <button class="btn btn-danger" onclick="clearAll()"><i class="fas fa-trash"></i> CLEAR ALL</button>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="SEARCH KEY..." oninput="filterKeys()">
                <select id="statusFilter" onchange="filterKeys()">
                    <option value="all">ALL STATUS</option>
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="EXPIRED">EXPIRED</option>
                    <option value="UNUSED">UNUSED</option>
                    <option value="USED">USED</option>
                </select>
                <select id="typeFilter" onchange="filterKeys()">
                    <option value="all">ALL TYPES</option>
                    <option value="standard">STANDARD</option>
                    <option value="5hour">5-HOUR</option>
                    <option value="custom">CUSTOM</option>
                </select>
            </div>
            
            <div class="scrollable">
                <table>
                    <thead>
                        <tr>
                            <th>KEY</th>
                            <th>TYPE</th>
                            <th>DURATION</th>
                            <th>DEVICES</th>
                            <th>STATUS</th>
                            <th>EXPIRES</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="keysTable"></tbody>
                </table>
            </div>
        </div>
        
        <div class="footer">
            <i class="fas fa-crown" style="color:var(--primary);"></i> HEX CHEATS GITXOS v3.0 &bull; <span>SECURE KEY MANAGEMENT</span>
        </div>
    </div>

    <script>
        let allKeys = [];

        function loadKeys() {
            fetch('/api/keys')
                .then(res => res.json())
                .then(data => {
                    allKeys = data || [];
                    renderKeys(allKeys);
                })
                .catch(() => toast('FAILED TO LOAD KEYS', 'error'));
        }

        function renderKeys(keys) {
            const tbody = document.getElementById('keysTable');
            tbody.innerHTML = '';
            
            if (!keys || keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#444; padding:30px;">NO KEYS FOUND</td></tr>';
                return;
            }

            keys.forEach(k => {
                const status = k.status_display || 'UNKNOWN';
                let statusClass = 'status-inactive';
                if (status.includes('ACTIVE')) statusClass = 'status-active';
                else if (status.includes('EXPIRED')) statusClass = 'status-expired';
                else if (status.includes('USED')) statusClass = 'status-used';
                
                let durationClass = 'duration-hours';
                let durationDisplay = `${k.duration_value}h`;
                if (k.duration_type === 'days') {
                    durationClass = 'duration-days';
                    durationDisplay = `${k.duration_value}d`;
                }
                if (k.key_type === '5HOUR') {
                    durationClass = 'duration-5hour';
                    durationDisplay = '5H';
                }
                
                let typeClass = 'key-type-standard';
                let typeDisplay = 'STD';
                if (k.key_type === '5HOUR') { typeClass = 'key-type-5hour'; typeDisplay = '5H'; }
                if (k.is_custom) { typeClass = 'key-type-custom'; typeDisplay = k.key_type || 'CUSTOM'; }
                
                const deviceDisplay = `${k.current_devices || 0}/${k.device_limit || 1}`;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-family:'Space Mono',monospace; font-size:11px; color:#fff;">${k.key}</td>
                    <td><span class="key-type-badge ${typeClass}">${typeDisplay}</span></td>
                    <td><span class="duration-badge ${durationClass}">${durationDisplay}</span></td>
                    <td style="font-size:10px;">${deviceDisplay}</td>
                    <td class="${statusClass}" style="font-size:9px; letter-spacing:1px;">${status}</td>
                    <td style="font-size:9px; color:#666;">${new Date(k.expires).toLocaleString()}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteKey('${k.key}')"><i class="fas fa-trash"></i></button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterKeys() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusFilter = document.getElementById('statusFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;

            let filtered = allKeys;

            if (search) {
                filtered = filtered.filter(k => k.key.toLowerCase().includes(search));
            }

            if (statusFilter !== 'all') {
                filtered = filtered.filter(k => {
                    const status = k.status_display || 'UNKNOWN';
                    if (statusFilter === 'ACTIVE') return status.includes('ACTIVE') && !status.includes('EXPIRED');
                    if (statusFilter === 'EXPIRED') return status.includes('EXPIRED');
                    if (statusFilter === 'UNUSED') return status === 'UNUSED';
                    if (statusFilter === 'USED') return status.includes('USED') && !status.includes('EXPIRED');
                    return true;
                });
            }

            if (typeFilter !== 'all') {
                filtered = filtered.filter(k => {
                    if (typeFilter === 'standard') return k.key_type === 'STANDARD' && !k.is_custom;
                    if (typeFilter === '5hour') return k.key_type === '5HOUR';
                    if (typeFilter === 'custom') return k.is_custom;
                    return true;
                });
            }

            renderKeys(filtered);
        }

        function deleteKey(key) {
            if (!confirm('DELETE KEY: ' + key + '?')) return;
            fetch(`/api/delete/${key}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        toast('KEY DELETED', 'success');
                        loadKeys();
                    } else {
                        toast('DELETE FAILED', 'error');
                    }
                })
                .catch(() => toast('DELETE ERROR', 'error'));
        }

        function clearAll() {
            if (!confirm('DELETE ALL KEYS AND DEVICES?')) return;
            if (!confirm('FINAL CONFIRMATION?')) return;
            fetch('/api/clear', { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        toast('ALL DATA CLEARED', 'success');
                        loadKeys();
                    }
                })
                .catch(() => toast('CLEAR ERROR', 'error'));
        }

        function logout() {
            if (!confirm('CONFIRM LOGOUT?')) return;
            fetch('/admin/logout').then(() => {
                window.location.href = '/';
            });
        }

        function toast(msg, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = `toast toast-${type}`;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        document.addEventListener('DOMContentLoaded', loadKeys);
    </script>
</body>
</html>
