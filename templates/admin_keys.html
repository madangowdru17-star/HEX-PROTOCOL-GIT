<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX CHEATS GITXOS - Keys</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Orbitron', sans-serif; 
            background: #0a0a0a; 
            color: #fff; 
            min-height: 100vh;
        }
        
        .header {
            background: rgba(17,17,17,0.95);
            border-bottom: 1px solid rgba(0,255,136,0.1);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        
        .header h1 i {
            -webkit-text-fill-color: #00ff88;
            margin-right: 10px;
        }
        
        .header .badge {
            background: rgba(0,255,136,0.1);
            color: #00ff88;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 10px;
            letter-spacing: 2px;
            border: 1px solid rgba(0,255,136,0.1);
        }
        
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header .user-info .logout-btn {
            background: rgba(255,255,255,0.05);
            color: #888;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        
        .header .user-info .logout-btn:hover {
            background: rgba(255,68,68,0.1);
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .nav {
            background: rgba(17,17,17,0.95);
            border-bottom: 1px solid rgba(255,255,255,0.03);
            padding: 0 30px;
            display: flex;
            gap: 0;
            flex-wrap: wrap;
            backdrop-filter: blur(20px);
            position: sticky;
            top: 72px;
            z-index: 99;
        }
        
        .nav a {
            padding: 14px 24px;
            color: #555;
            text-decoration: none;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
        }
        
        .nav a:hover { color: #00ff88; }
        .nav a.active { color: #00ff88; border-bottom-color: #00ff88; }
        .nav a i { margin-right: 8px; }
        
        .container { max-width: 1440px; margin: 0 auto; padding: 25px; }
        
        .panel {
            background: rgba(17,17,17,0.8);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }
        
        .panel h3 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: 700;
        }
        
        .panel h3 i { margin-right: 10px; }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .btn-danger {
            background: #ff4444;
            color: #fff;
        }
        
        .btn-danger:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,68,68,0.2);
        }
        
        .btn-sm { padding: 4px 12px; font-size: 8px; }
        
        .status-active { color: #00ff88; }
        .status-used { color: #ffaa00; }
        .status-expired { color: #ff4444; }
        .status-inactive { color: #555; }
        
        .duration-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 10px;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .duration-hours { background: rgba(0,255,136,0.1); color: #00ff88; }
        .duration-days { background: rgba(0,153,255,0.1); color: #66aaff; }
        .duration-5hour { background: rgba(0,204,255,0.1); color: #00ccff; }
        
        .custom-tag {
            background: rgba(255,170,0,0.1);
            color: #ffaa00;
            padding: 1px 10px;
            border-radius: 10px;
            font-size: 7px;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid rgba(255,170,0,0.1);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }
        
        th {
            text-align: left;
            padding: 10px;
            color: #555;
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        
        td {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            color: #888;
        }
        
        tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        
        .scrollable {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .scrollable::-webkit-scrollbar {
            width: 4px;
        }
        .scrollable::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
        }
        .scrollable::-webkit-scrollbar-thumb {
            background: rgba(0,255,136,0.2);
            border-radius: 2px;
        }
        .scrollable::-webkit-scrollbar-thumb:hover {
            background: rgba(0,255,136,0.4);
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            z-index: 10000;
            animation: slideIn 0.5s ease;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .toast-success { background: #00cc66; color: #0a0a0a; }
        .toast-error { background: #ff4444; color: #fff; }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #333;
            font-size: 9px;
            letter-spacing: 2px;
            border-top: 1px solid rgba(255,255,255,0.03);
            margin-top: 20px;
            text-transform: uppercase;
        }
        
        .footer span { color: #00ff88; }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .search-box input,
        .search-box select {
            padding: 10px 14px;
            background: rgba(26,26,26,0.8);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            color: #fff;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        
        .search-box input:focus,
        .search-box select:focus {
            outline: none;
            border-color: rgba(0,255,136,0.2);
        }
        
        .key-type-badge {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 8px;
            font-size: 7px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .key-type-standard { background: rgba(0,255,136,0.1); color: #00ff88; }
        .key-type-5hour { background: rgba(0,204,255,0.1); color: #00ccff; }
        .key-type-custom { background: rgba(255,170,0,0.1); color: #ffaa00; }
        
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; padding: 15px; }
            .nav { padding: 0 15px; overflow-x: auto; flex-wrap: nowrap; }
            .nav a { padding: 12px 16px; font-size: 8px; white-space: nowrap; }
            .search-box { flex-direction: column; }
            table { font-size: 9px; }
            td, th { padding: 6px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-keys"></i> KEYS MANAGEMENT</h1>
        <div class="user-info">
            <span class="badge"><i class="fas fa-shield-alt"></i> SECURE</span>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> EXIT</button>
        </div>
    </div>
    
    <div class="nav">
        <a href="/dashboard"><i class="fas fa-home"></i> DASHBOARD</a>
        <a href="/keys" class="active"><i class="fas fa-keys"></i> KEYS</a>
        <a href="/devices"><i class="fas fa-laptop"></i> DEVICES</a>
        <a href="/api-status"><i class="fas fa-code"></i> API</a>
    </div>
    
    <div class="container">
        <div class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:15px;">
                <h3><i class="fas fa-list"></i> ALL KEYS</h3>
                <button class="btn btn-danger" onclick="clearAll()"><i class="fas fa-trash"></i> CLEAR ALL</button>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="SEARCH KEY..." oninput="filterKeys()">
                <select id="statusFilter" onchange="filterKeys()">
                    <option value="all">ALL STATUS</option>
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="EXPIRED">EXPIRED</option>
                    <option value="UNUSED">UNUSED</option>
                    <option value="USED">USED</option>
                </select>
                <select id="typeFilter" onchange="filterKeys()">
                    <option value="all">ALL TYPES</option>
                    <option value="standard">STANDARD</option>
                    <option value="5hour">5-HOUR</option>
                    <option value="custom">CUSTOM</option>
                </select>
            </div>
            
            <div class="scrollable">
                <table>
                    <thead>
                        <tr>
                            <th>KEY</th>
                            <th>TYPE</th>
                            <th>DURATION</th>
                            <th>DEVICES</th>
                            <th>STATUS</th>
                            <th>EXPIRES</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="keysTable"></tbody>
                </table>
            </div>
        </div>
        
        <div class="footer">
            <i class="fas fa-crown" style="color:#00ff88;"></i> HEX CHEATS GITXOS v3.0 &bull; <span>SECURE KEY MANAGEMENT</span>
        </div>
    </div>

    <script>
        let allKeys = [];

        function loadKeys() {
            fetch('/api/keys')
                .then(res => res.json())
                .then(data => {
                    allKeys = data || [];
                    renderKeys(allKeys);
                })
                .catch(() => toast('FAILED TO LOAD KEYS', 'error'));
        }

        function renderKeys(keys) {
            const tbody = document.getElementById('keysTable');
            tbody.innerHTML = '';
            
            if (!keys || keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#333; padding:30px;">NO KEYS FOUND</td></tr>';
                return;
            }

            keys.forEach(k => {
                const status = k.status_display || 'UNKNOWN';
                let statusClass = 'status-inactive';
                if (status.includes('ACTIVE')) statusClass = 'status-active';
                else if (status.includes('EXPIRED')) statusClass = 'status-expired';
                else if (status.includes('USED')) statusClass = 'status-used';
                
                let durationClass = 'duration-hours';
                let durationDisplay = `${k.duration_value}h`;
                if (k.duration_type === 'days') {
                    durationClass = 'duration-days';
                    durationDisplay = `${k.duration_value}d`;
                }
                if (k.key_type === '5HOUR') {
                    durationClass = 'duration-5hour';
                    durationDisplay = '5H';
                }
                
                let typeClass = 'key-type-standard';
                let typeDisplay = 'STD';
                if (k.key_type === '5HOUR') { typeClass = 'key-type-5hour'; typeDisplay = '5H'; }
                if (k.is_custom) { typeClass = 'key-type-custom'; typeDisplay = k.key_type || 'CUSTOM'; }
                
                const deviceDisplay = `${k.current_devices || 0}/${k.device_limit || 1}`;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-family:'Courier New',monospace; font-size:11px; color:#fff;">${k.key}</td>
                    <td><span class="key-type-badge ${typeClass}">${typeDisplay}</span></td>
                    <td><span class="duration-badge ${durationClass}">${durationDisplay}</span></td>
                    <td style="font-size:10px;">${deviceDisplay}</td>
                    <td class="${statusClass}" style="font-size:9px; letter-spacing:1px;">${status}</td>
                    <td style="font-size:9px; color:#444;">${new Date(k.expires).toLocaleString()}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteKey('${k.key}')"><i class="fas fa-trash"></i></button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterKeys() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusFilter = document.getElementById('statusFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;

            let filtered = allKeys;

            if (search) {
                filtered = filtered.filter(k => k.key.toLowerCase().includes(search));
            }

            if (statusFilter !== 'all') {
                filtered = filtered.filter(k => {
                    const status = k.status_display || 'UNKNOWN';
                    if (statusFilter === 'ACTIVE') return status.includes('ACTIVE') && !status.includes('EXPIRED');
                    if (statusFilter === 'EXPIRED') return status.includes('EXPIRED');
                    if (statusFilter === 'UNUSED') return status === 'UNUSED';
                    if (statusFilter === 'USED') return status.includes('USED') && !status.includes('EXPIRED');
                    return true;
                });
            }

            if (typeFilter !== 'all') {
                filtered = filtered.filter(k => {
                    if (typeFilter === 'standard') return k.key_type === 'STANDARD' && !k.is_custom;
                    if (typeFilter === '5hour') return k.key_type === '5HOUR';
                    if (typeFilter === 'custom') return k.is_custom;
                    return true;
                });
            }

            renderKeys(filtered);
        }

        function deleteKey(key) {
            if (!confirm('DELETE KEY: ' + key + '?')) return;
            fetch(`/api/delete/${key}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        toast('KEY DELETED', 'success');
                        loadKeys();
                    } else {
                        toast('DELETE FAILED', 'error');
                    }
                })
                .catch(() => toast('DELETE ERROR', 'error'));
        }

        function clearAll() {
            if (!confirm('DELETE ALL KEYS AND DEVICES?')) return;
            if (!confirm('FINAL CONFIRMATION?')) return;
            fetch('/api/clear', { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        toast('ALL DATA CLEARED', 'success');
                        loadKeys();
                    }
                })
                .catch(() => toast('CLEAR ERROR', 'error'));
        }

        function logout() {
            if (!confirm('CONFIRM LOGOUT?')) return;
            fetch('/admin/logout').then(() => {
                window.location.href = '/';
            });
        }

        function toast(msg, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = `toast toast-${type}`;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        document.addEventListener('DOMContentLoaded', loadKeys);
    </script>
</body>
</html>
