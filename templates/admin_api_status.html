<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX CHEATS GITXOS - API Status</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
        :root { --primary: #00ff88; --card-bg: rgba(20, 20, 50, 0.7); --border-color: rgba(0, 255, 136, 0.1); }
        body { font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #000814 0%, #001040 50%, #000814 100%); background-attachment: fixed; color: #fff; min-height: 100vh; }
        .header { background: rgba(0, 8, 20, 0.9); border-bottom: 1px solid var(--border-color); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; backdrop-filter: blur(30px); position: sticky; top: 0; z-index: 100; box-shadow: 0 8px 32px rgba(0, 255, 136, 0.08); }
        .header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--primary), #00cc66); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; display: flex; align-items: center; gap: 12px; }
        .header h1 i { -webkit-text-fill-color: var(--primary); font-size: 28px; }
        .header .badge { background: rgba(0, 255, 136, 0.08); color: var(--primary); padding: 8px 18px; border-radius: 25px; font-size: 11px; letter-spacing: 1px; border: 1px solid var(--border-color); font-weight: 500; text-transform: uppercase; }
        .header .user-info { display: flex; align-items: center; gap: 20px; }
        .header .user-info .logout-btn { background: linear-gradient(135deg, rgba(255, 68, 68, 0.1), rgba(255, 100, 100, 0.05)); color: #ff6464; border: 1px solid rgba(255, 100, 100, 0.2); padding: 10px 24px; border-radius: 10px; cursor: pointer; font-family: 'Outfit', sans-serif; font-size: 11px; letter-spacing: 1px; transition: all 0.3s ease; text-transform: uppercase; font-weight: 600; }
        .header .user-info .logout-btn:hover { background: linear-gradient(135deg, rgba(255, 68, 68, 0.2), rgba(255, 100, 100, 0.1)); border-color: #ff6464; color: #ff8888; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 68, 68, 0.2); }
        .nav { background: rgba(0, 8, 20, 0.9); border-bottom: 1px solid var(--border-color); padding: 0 40px; display: flex; gap: 0; flex-wrap: wrap; backdrop-filter: blur(30px); position: sticky; top: 72px; z-index: 99; }
        .nav a { padding: 16px 28px; color: #888; text-decoration: none; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; transition: all 0.3s ease; border-bottom: 2px solid transparent; }
        .nav a:hover { color: var(--primary); }
        .nav a.active { color: var(--primary); border-bottom-color: var(--primary); }
        .nav a i { margin-right: 8px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 40px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 28px; text-align: center; transition: all 0.3s ease; backdrop-filter: blur(10px); }
        .stat:hover { border-color: rgba(0, 255, 136, 0.2); transform: translateY(-4px); box-shadow: 0 15px 50px rgba(0, 255, 136, 0.1); }
        .stat .icon { font-size: 28px; color: var(--primary); margin-bottom: 12px; opacity: 0.7; }
        .stat .num { font-size: 38px; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
        .stat .label { color: #999; font-size: 10px; text-transform: uppercase; margin-top: 8px; letter-spacing: 1px; font-weight: 500; }
        .panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 32px; margin-bottom: 30px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .panel h3 { color: var(--primary); margin-bottom: 20px; font-size: 16px; letter-spacing: 1px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .status-box { background: rgba(0, 255, 136, 0.05); border: 1px solid rgba(0, 255, 136, 0.2); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .status-label { color: #999; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 8px; }
        .status-value { color: var(--primary); font-size: 16px; font-family: 'Space Mono', monospace; word-break: break-all; }
        .status-success { color: var(--primary); }
        .status-error { color: #ff6464; }
        .toast { position: fixed; bottom: 30px; right: 30px; padding: 16px 28px; border-radius: 14px; font-weight: 600; z-index: 10000; animation: slideIn 0.5s ease; font-family: 'Outfit', sans-serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-success { background: linear-gradient(135deg, var(--primary), #00cc66); color: #000; }
        .toast-error { background: linear-gradient(135deg, #ff6464, #ff4444); color: #fff; }
        .footer { text-align: center; padding: 30px 40px; color: #666; font-size: 10px; letter-spacing: 1px; border-top: 1px solid var(--border-color); margin-top: 40px; text-transform: uppercase; background: linear-gradient(180deg, rgba(0, 8, 20, 0.5), rgba(0, 0, 0, 0.8)); }
        .footer span { color: var(--primary); font-weight: 600; }
        @media (max-width: 768px) { .header { flex-direction: column; gap: 12px; padding: 15px 20px; } .nav { padding: 0 20px; overflow-x: auto; flex-wrap: nowrap; top: 68px; } .container { padding: 20px; } .stats { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-code"></i> API STATUS</h1>
        <div class="user-info">
            <span class="badge"><i class="fas fa-shield-alt"></i> SECURE</span>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> EXIT</button>
        </div>
    </div>
    <div class="nav">
        <a href="/dashboard"><i class="fas fa-home"></i> DASHBOARD</a>
        <a href="/keys"><i class="fas fa-keys"></i> KEYS</a>
        <a href="/devices"><i class="fas fa-laptop"></i> DEVICES</a>
        <a href="/api-status" class="active"><i class="fas fa-code"></i> API</a>
    </div>
    <div class="container">
        <div class="stats">
            <div class="stat">
                <div class="icon"><i class="fas fa-server"></i></div>
                <div class="num" id="dbStatus">--</div>
                <div class="label">DATABASE STATUS</div>
            </div>
            <div class="stat">
                <div class="icon"><i class="fas fa-heartbeat"></i></div>
                <div class="num" id="apiStatus">--</div>
                <div class="label">API STATUS</div>
            </div>
        </div>
        <div class="panel">
            <h3><i class="fas fa-database"></i> DATABASE CONNECTION</h3>
            <div class="status-box">
                <div class="status-label">Status</div>
                <div class="status-value" id="dbStatusDetail">Checking...</div>
            </div>
            <div class="status-box">
                <div class="status-label">Message</div>
                <div class="status-value" id="dbMessage">Please wait...</div>
            </div>
        </div>
        <div class="panel">
            <h3><i class="fas fa-cogs"></i> SYSTEM ENDPOINTS</h3>
            <div class="status-box">
                <div class="status-label">Available Endpoints</div>
                <div class="status-value" id="endpoints" style="font-size:12px;">Loaded...</div>
            </div>
        </div>
        <div class="footer">
            <i class="fas fa-crown" style="color:var(--primary);"></i> HEX CHEATS GITXOS v3.0 &bull; <span>SECURE KEY MANAGEMENT</span>
        </div>
    </div>
    <script>
        function checkStatus() {
            fetch('/db-check')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('dbStatus').textContent = data.status === 'ok' ? '✓' : '✗';
                    document.getElementById('dbStatusDetail').className = `status-value status-${data.status === 'ok' ? 'success' : 'error'}`;
                    document.getElementById('dbStatusDetail').textContent = data.status.toUpperCase();
                    document.getElementById('dbMessage').textContent = data.message;
                    document.getElementById('apiStatus').textContent = '✓';
                })
                .catch(err => {
                    document.getElementById('dbStatus').textContent = '✗';
                    document.getElementById('dbStatusDetail').textContent = 'CONNECTION FAILED';
                    document.getElementById('dbStatusDetail').className = 'status-value status-error';
                    document.getElementById('dbMessage').textContent = err.message;
                    document.getElementById('apiStatus').textContent = '✗';
                });
            
            const endpoints = ['POST /api/login', 'GET /api/stats', 'GET /api/keys', 'GET /api/devices', 'GET /api/activity', 'POST /api/generate', 'POST /api/generate/5hour', 'DELETE /api/delete/{key}', 'DELETE /api/clear'];
            document.getElementById('endpoints').textContent = endpoints.join(' • ');
        }
        function logout() {
            if (!confirm('CONFIRM LOGOUT?')) return;
            fetch('/admin/logout').then(() => { window.location.href = '/'; });
        }
        document.addEventListener('DOMContentLoaded', checkStatus);
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
