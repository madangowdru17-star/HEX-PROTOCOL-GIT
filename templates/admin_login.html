<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX CHEATS GITXOS - Premium Admin Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #000814 0%, #001040 50%, #000814 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }
        
        .background-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .gradient-ball {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }
        
        .ball-1 { width: 300px; height: 300px; background: #00ff88; top: -100px; left: -100px; animation-delay: 0s; }
        .ball-2 { width: 250px; height: 250px; background: #0066ff; bottom: -80px; right: -80px; animation-delay: 5s; }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }
        
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }
        
        .login-card {
            background: rgba(20, 20, 50, 0.7);
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 24px;
            padding: 60px 40px;
            backdrop-filter: blur(30px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        
        .icon {
            font-size: 56px;
            color: #00ff88;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #999;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
            font-weight: 500;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            color: #999;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(30, 40, 80, 0.4);
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }
        
        input[type="password"]::placeholder {
            color: #666;
        }
        
        input[type="password"]:focus {
            outline: none;
            border-color: rgba(0, 255, 136, 0.4);
            background: rgba(30, 40, 80, 0.6);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
            font-family: 'Outfit', sans-serif;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 255, 136, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .status-text {
            color: #666;
            font-size: 10px;
            margin-top: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .status-text.success {
            color: #00ff88;
        }
        
        .status-text.error {
            color: #ff6464;
        }
        
        .info-box {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            font-size: 10px;
            color: #aaa;
            line-height: 1.6;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 9px;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .footer span {
            color: #00ff88;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="background-elements">
        <div class="gradient-ball ball-1"></div>
        <div class="gradient-ball ball-2"></div>
    </div>
    
    <div class="login-container">
        <div class="login-card">
            <div class="icon">
                <i class="fas fa-crown"></i>
            </div>
            <h1>HEX CHEATS</h1>
            <p class="subtitle">GITXOS SECURE ADMIN PORTAL</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label><i class="fas fa-lock"></i> Admin Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> ACCESS PANEL
                </button>
            </form>
            
            <p id="statusText" class="status-text"></p>
            
            <div class="info-box">
                <i class="fas fa-shield-alt"></i> SECURE AUTHENTICATION REQUIRED
            </div>
            
            <div class="footer">
                <i class="fas fa-lock"></i> <span>PREMIUM</span> SECURE KEY MANAGEMENT v3.0
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const statusText = document.getElementById('statusText');
            
            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusText.textContent = 'AUTHENTICATED ✓';
                    statusText.className = 'status-text success';
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 800);
                } else {
                    statusText.textContent = 'INVALID PASSWORD';
                    statusText.className = 'status-text error';
                    document.getElementById('password').value = '';
                }
            } catch (error) {
                statusText.textContent = 'ERROR: ' + error.message;
                statusText.className = 'status-text error';
            }
        });
    </script>
</body>
</html>
