<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX CHEATS GITXOS - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Orbitron', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(0,255,136,0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(0,255,136,0.03) 0%, transparent 50%);
        }
        
        .login-container {
            background: rgba(17,17,17,0.95);
            border: 1px solid rgba(0,255,136,0.2);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 0 80px rgba(0,255,136,0.05), inset 0 0 80px rgba(0,255,136,0.02);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, transparent, rgba(0,255,136,0.1), transparent);
            border-radius: 20px;
            z-index: -1;
            background-size: 400% 400%;
            animation: gradient 3s ease infinite;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .login-container .icon {
            font-size: 48px;
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0,255,136,0.3);
        }
        
        .login-container h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        
        .login-container .subtitle {
            color: #666;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 400;
        }
        
        .login-container .subtitle span {
            color: #00ff88;
        }
        
        .login-container .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .login-container .input-group label {
            display: block;
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        
        .login-container .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(26,26,26,0.8);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s;
        }
        
        .login-container .input-group input:focus {
            outline: none;
            border-color: rgba(0,255,136,0.3);
            box-shadow: 0 0 30px rgba(0,255,136,0.05);
            background: rgba(26,26,26,1);
        }
        
        .login-container .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #0a0a0a;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .login-container .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(0,255,136,0.2);
        }
        
        .login-container .error-msg {
            color: #ff4444;
            font-size: 12px;
            margin-top: 12px;
            min-height: 20px;
            font-weight: 400;
            letter-spacing: 1px;
        }
        
        .login-container .footer-text {
            margin-top: 25px;
            color: #333;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .login-container .footer-text span {
            color: #00ff88;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            z-index: 10000;
            animation: slideIn 0.5s ease;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .toast-success { background: #00cc66; color: #0a0a0a; }
        .toast-error { background: #ff4444; color: #fff; }
        
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; }
            .login-container h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="icon">
            <i class="fas fa-crown"></i>
        </div>
        <h1>HEX CHEATS</h1>
        <p class="subtitle"><span>GITXOS</span> · ADMIN ACCESS</p>
        
        <div class="input-group">
            <label><i class="fas fa-lock"></i> SECURE KEY</label>
            <input type="password" id="adminPass" placeholder="Enter access code" onkeypress="if(event.key==='Enter') login()">
        </div>
        
        <button class="btn-login" onclick="login()">
            <i class="fas fa-unlock"></i> UNLOCK SYSTEM
        </button>
        
        <div class="error-msg" id="errorMsg"></div>
        
        <div class="footer-text">
            <span class="status-dot"></span> SYSTEM SECURE · v3.0
        </div>
    </div>

    <script>
        function login() {
            const pass = document.getElementById('adminPass').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (!pass) {
                errorMsg.textContent = 'ENTER ACCESS CODE';
                return;
            }
            
            fetch('/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorMsg.textContent = 'ACCESS DENIED';
                    document.getElementById('adminPass').value = '';
                    document.getElementById('adminPass').focus();
                    toast('INVALID ACCESS CODE', 'error');
                }
            })
            .catch(() => {
                errorMsg.textContent = 'CONNECTION ERROR';
                toast('CONNECTION ERROR', 'error');
            });
        }

        function toast(msg, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = `toast toast-${type}`;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('adminPass').focus();
        });
    </script>
</body>
</html>
