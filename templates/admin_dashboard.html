<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX KEY SYSTEM - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
        
        /* Header */
        .header { background: linear-gradient(135deg, #00ff88, #00cc66); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { color: #0a0a0a; font-size: 22px; }
        .header h1 i { margin-right: 10px; }
        .header .badge { background: #0a0a0a; color: #00ff88; padding: 5px 15px; border-radius: 20px; font-size: 12px; }
        .header .user-info { display: flex; align-items: center; gap: 15px; }
        .header .user-info .logout-btn { background: rgba(0,0,0,0.3); color: #0a0a0a; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .header .user-info .logout-btn:hover { background: rgba(0,0,0,0.5); }
        
        /* Navigation */
        .nav { background: #111; border-bottom: 1px solid #222; padding: 0 30px; display: flex; gap: 5px; flex-wrap: wrap; }
        .nav a { padding: 14px 20px; color: #666; text-decoration: none; font-size: 13px; font-weight: 600; transition: 0.3s; border-bottom: 3px solid transparent; }
        .nav a:hover { color: #00ff88; border-bottom-color: #00ff88; }
        .nav a.active { color: #00ff88; border-bottom-color: #00ff88; }
        .nav a i { margin-right: 8px; }
        
        /* Container */
        .container { max-width: 1400px; margin: 0 auto; padding: 25px; }
        
        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat { background: #111; border: 1px solid #222; border-radius: 12px; padding: 20px; text-align: center; transition: 0.3s; }
        .stat:hover { border-color: #00ff88; transform: translateY(-2px); }
        .stat .num { font-size: 32px; font-weight: 900; color: #00ff88; }
        .stat .label { color: #666; font-size: 11px; text-transform: uppercase; margin-top: 5px; letter-spacing: 0.5px; }
        .stat .icon { font-size: 20px; color: #333; margin-bottom: 8px; }
        
        /* Panels */
        .panel { background: #111; border: 1px solid #222; border-radius: 12px; padding: 25px; margin-bottom: 25px; }
        .panel h3 { color: #00ff88; margin-bottom: 15px; font-size: 18px; }
        .panel h3 i { margin-right: 10px; }
        .panel .subtitle { color: #666; font-size: 13px; margin-bottom: 15px; }
        
        /* Forms */
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .input-group input, .input-group select { padding: 10px 14px; background: #1a1a1a; border: 2px solid #222; border-radius: 8px; color: #fff; font-size: 14px; flex: 1; min-width: 80px; }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: #00ff88; }
        .input-group textarea { padding: 10px 14px; background: #1a1a1a; border: 2px solid #222; border-radius: 8px; color: #fff; font-size: 13px; flex: 1; min-width: 200px; font-family: monospace; resize: vertical; }
        
        /* Buttons */
        .btn { padding: 10px 22px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 13px; }
        .btn-primary { background: #00ff88; color: #0a0a0a; }
        .btn-primary:hover { transform: scale(1.04); box-shadow: 0 0 20px rgba(0,255,136,0.2); }
        .btn-custom { background: #ffaa00; color: #0a0a0a; }
        .btn-custom:hover { transform: scale(1.04); }
        .btn-danger { background: #ff4444; color: #fff; }
        .btn-danger:hover { transform: scale(1.04); }
        .btn-info { background: #3399ff; color: #fff; }
        .btn-info:hover { transform: scale(1.04); }
        .btn-sm { padding: 5px 12px; font-size: 11px; }
        
        .key-display { background: #0a0a0a; border: 2px solid #222; border-radius: 8px; padding: 12px 18px; font-family: monospace; font-size: 16px; color: #00ff88; margin: 8px 0; display: inline-block; }
        .copy-btn { background: none; border: none; color: #00ff88; cursor: pointer; margin-left: 10px; }
        .copy-btn:hover { color: #fff; }
        
        .duration-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .duration-hours { background: #1a3a2a; color: #00ff88; }
        .duration-days { background: #1a2a3a; color: #66aaff; }
        
        .custom-tag { background: #ffaa00; color: #0a0a0a; padding: 1px 8px; border-radius: 10px; font-size: 9px; font-weight: 700; }
        
        .status-active { color: #00ff88; }
        .status-used { color: #ffaa00; }
        .status-expired { color: #ff4444; }
        .status-inactive { color: #666; }
        
        .toast { position: fixed; bottom: 30px; right: 30px; padding: 12px 24px; border-radius: 8px; font-weight: 600; z-index: 10000; animation: slideIn 0.5s ease; }
        .toast-success { background: #00cc66; color: #0a0a0a; }
        .toast-error { background: #ff4444; color: #fff; }
        .toast-info { background: #3399ff; color: #fff; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .footer { text-align: center; padding: 20px; color: #444; font-size: 12px; border-top: 1px solid #111; margin-top: 20px; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; padding: 15px; }
            .nav { padding: 0 15px; overflow-x: auto; flex-wrap: nowrap; }
            .nav a { padding: 12px 15px; font-size: 12px; white-space: nowrap; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .input-group { flex-direction: column; }
            .input-group input, .input-group select, .input-group textarea { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-crown"></i> HEX KEY SYSTEM</h1>
        <div class="user-info">
            <span class="badge"><i class="fas fa-shield-alt"></i> SECURE</span>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    
    <div class="nav">
        <a href="/dashboard" class="active"><i class="fas fa-home"></i> Dashboard</a>
        <a href="/keys"><i class="fas fa-keys"></i> Keys</a>
        <a href="/devices"><i class="fas fa-laptop"></i> Devices</a>
        <a href="/api-status"><i class="fas fa-code"></i> API Status</a>
    </div>
    
    <div class="container">
        <!-- Stats -->
        <div class="stats" id="stats">
            <div class="stat">
                <div class="icon"><i class="fas fa-keys"></i></div>
                <div class="num" id="totalKeys">0</div>
                <div class="label">Total Keys</div>
            </div>
            <div class="stat">
                <div class="icon"><i class="fas fa-check-circle"></i></div>
                <div class="num" id="activeKeys">0</div>
                <div class="label">Active Keys</div>
            </div>
            <div class="stat">
                <div class="icon"><i class="fas fa-user-check"></i></div>
                <div class="num" id="usedKeys">0</div>
                <div class="label">Used Keys</div>
            </div>
            <div class="stat">
                <div class="icon"><i class="fas fa-clock"></i></div>
                <div class="num" id="expiredKeys">0</div>
                <div class="label">Expired Keys</div>
            </div>
            <div class="stat">
                <div class="icon"><i class="fas fa-laptop"></i></div>
                <div class="num" id="totalDevices">0</div>
                <div class="label">Devices</div>
            </div>
            <div class="stat">
                <div class="icon"><i class="fas fa-globe"></i></div>
                <div class="num" id="uniqueIps">0</div>
                <div class="label">Unique IPs</div>
            </div>
        </div>
        
        <!-- Generate Keys -->
        <div class="panel">
            <h3><i class="fas fa-robot"></i> Generate Keys</h3>
            <div class="input-group">
                <input type="number" id="keyCount" value="1" min="1" max="50" style="max-width:70px;">
                <input type="number" id="durationValue" value="24" min="1" max="9999" style="max-width:80px;">
                <select id="durationType" style="max-width:100px;">
                    <option value="hours">Hours</option>
                    <option value="days">Days</option>
                </select>
                <input type="number" id="deviceLimit" value="1" min="1" max="10" style="max-width:70px;" placeholder="Devices">
                <button class="btn btn-primary" onclick="generateKeys()"><i class="fas fa-wand-magic-sparkles"></i> Generate</button>
            </div>
            <div id="generatedKeys" style="margin-top:15px;"></div>
        </div>
        
        <!-- Custom Keys -->
        <div class="panel" style="border-color: #ffaa00;">
            <h3><i class="fas fa-pen"></i> Custom Keys</h3>
            <div class="input-group">
                <textarea id="customKeysText" rows="3" placeholder="MYKEY123&#10;VIPKEY456" style="flex:2;"></textarea>
                <div style="display:flex; flex-direction:column; gap:8px; flex:1; min-width:150px;">
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        <input type="number" id="customDurationValue" value="24" min="1" max="9999" style="flex:1; min-width:60px;">
                        <select id="customDurationType" style="flex:1; min-width:80px;">
                            <option value="hours">Hours</option>
                            <option value="days">Days</option>
                        </select>
                        <input type="number" id="customDeviceLimit" value="1" min="1" max="10" style="flex:1; min-width:60px;" placeholder="Devices">
                    </div>
                    <button class="btn btn-custom" onclick="generateCustomKeys()"><i class="fas fa-plus"></i> Add Keys</button>
                </div>
            </div>
            <div id="customGeneratedKeys" style="margin-top:15px;"></div>
        </div>
        
        <!-- Recent Activity -->
        <div class="panel">
            <h3><i class="fas fa-history"></i> Recent Activity</h3>
            <div style="max-height:250px; overflow-y:auto;">
                <table style="width:100%; border-collapse:collapse; font-size:13px;">
                    <thead>
                        <tr>
                            <th style="text-align:left; padding:8px; color:#666; font-size:11px; text-transform:uppercase; border-bottom:2px solid #222;">Time</th>
                            <th style="text-align:left; padding:8px; color:#666; font-size:11px; text-transform:uppercase; border-bottom:2px solid #222;">Action</th>
                            <th style="text-align:left; padding:8px; color:#666; font-size:11px; text-transform:uppercase; border-bottom:2px solid #222;">Details</th>
                        </tr>
                    </thead>
                    <tbody id="activityTable"></tbody>
                </table>
            </div>
        </div>
        
        <div class="footer">
            <i class="fas fa-crown" style="color:#00ff88;"></i> HEX KEY SYSTEM v2.0 &bull; Secure Key Management
        </div>
    </div>

    <script>
        // =============================================
        // LOAD ALL DATA
        // =============================================
        function loadAll() {
            loadStats();
            loadActivity();
        }

        function loadStats() {
            fetch('/api/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('totalKeys').textContent = data.total_keys || 0;
                    document.getElementById('activeKeys').textContent = data.active_keys || 0;
                    document.getElementById('usedKeys').textContent = data.used_keys || 0;
                    document.getElementById('expiredKeys').textContent = data.expired_keys || 0;
                    document.getElementById('totalDevices').textContent = data.total_devices || 0;
                    document.getElementById('uniqueIps').textContent = data.unique_ips || 0;
                })
                .catch(() => console.log('Stats load error'));
        }

        function loadActivity() {
            fetch('/api/activity')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('activityTable');
                    tbody.innerHTML = '';
                    if (!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#444; padding:15px;">No activity</td></tr>';
                        return;
                    }
                    data.slice(-10).reverse().forEach(a => {
                        const tr = document.createElement('tr');
                        const details = typeof a.details === 'string' ? a.details : JSON.stringify(a.details);
                        tr.innerHTML = `
                            <td style="padding:8px; font-size:11px; border-bottom:1px solid #1a1a1a;">${new Date(a.timestamp).toLocaleString()}</td>
                            <td style="padding:8px; border-bottom:1px solid #1a1a1a;"><span style="color:#00ff88;">${a.action}</span></td>
                            <td style="padding:8px; font-size:12px; color:#888; border-bottom:1px solid #1a1a1a;">${details}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(() => console.log('Activity load error'));
        }

        // =============================================
        // GENERATE KEYS
        // =============================================
        function generateKeys() {
            const count = document.getElementById('keyCount').value || 1;
            const durationValue = document.getElementById('durationValue').value || 24;
            const durationType = document.getElementById('durationType').value;
            const deviceLimit = document.getElementById('deviceLimit').value || 1;

            fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    count: parseInt(count), 
                    duration_value: parseInt(durationValue),
                    duration_type: durationType,
                    device_limit: parseInt(deviceLimit)
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    let html = '<div style="display:flex; flex-wrap:wrap; gap:10px;">';
                    data.keys.forEach(k => {
                        html += `<div class="key-display">${k} <button class="copy-btn" onclick="copyKey('${k}')"><i class="fas fa-copy"></i></button></div>`;
                    });
                    html += `<div style="width:100%; color:#888; font-size:12px; margin-top:5px;">Device limit: ${data.device_limit}</div>`;
                    html += '</div>';
                    document.getElementById('generatedKeys').innerHTML = html;
                    toast('Generated ' + data.count + ' key(s)', 'success');
                    loadAll();
                } else {
                    toast('Failed: ' + (data.error || 'Unknown'), 'error');
                }
            })
            .catch(err => toast('Error: ' + err.message, 'error'));
        }

        function generateCustomKeys() {
            const keysText = document.getElementById('customKeysText').value;
            const durationValue = document.getElementById('customDurationValue').value || 24;
            const durationType = document.getElementById('customDurationType').value;
            const deviceLimit = document.getElementById('customDeviceLimit').value || 1;

            if (!keysText.trim()) {
                toast('Enter at least one key', 'error');
                return;
            }

            const keys = keysText.split('\n').map(k => k.trim().toUpperCase()).filter(k => k);
            if (keys.length === 0) {
                toast('No valid keys', 'error');
                return;
            }

            fetch('/api/generate/custom', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    keys: keys,
                    duration_value: parseInt(durationValue),
                    duration_type: durationType,
                    device_limit: parseInt(deviceLimit)
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    let html = '<div style="display:flex; flex-wrap:wrap; gap:10px;">';
                    data.keys.forEach(k => {
                        html += `<div class="key-display" style="border-color:#ffaa00;">${k} ✏️ <button class="copy-btn" onclick="copyKey('${k}')"><i class="fas fa-copy"></i></button></div>`;
                    });
                    if (data.duplicates && data.duplicates.length > 0) {
                        html += `<div style="color:#ffaa00; font-size:12px;">⚠️ Duplicates: ${data.duplicates.join(', ')}</div>`;
                    }
                    html += `<div style="width:100%; color:#888; font-size:12px;">Device limit: ${data.device_limit}</div>`;
                    html += '</div>';
                    document.getElementById('customGeneratedKeys').innerHTML = html;
                    document.getElementById('customKeysText').value = '';
                    toast('Added ' + data.count + ' custom key(s)', 'success');
                    loadAll();
                } else {
                    toast('Failed: ' + (data.error || 'Unknown'), 'error');
                }
            })
            .catch(err => toast('Error: ' + err.message, 'error'));
        }

        // =============================================
        // UTILITY FUNCTIONS
        // =============================================
        function copyKey(key) {
            navigator.clipboard.writeText(key);
            toast('Copied!', 'success');
        }

        function logout() {
            if (!confirm('Are you sure you want to logout?')) return;
            fetch('/admin/logout').then(() => {
                window.location.href = '/';
            });
        }

        function toast(msg, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = `toast toast-${type}`;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        // Auto-refresh every 30 seconds
        setInterval(loadAll, 30000);

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadAll);
    </script>
</body>
</html>
